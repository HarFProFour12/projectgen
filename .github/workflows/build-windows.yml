name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build ProjectGen
        run: |
          pyinstaller --clean ProjectGen.spec

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ProjectGen/*" -DestinationPath "ProjectGen-Windows.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectGen-Windows
          path: ProjectGen-Windows.zip